[project]
name = "my-ocr-app"
version = "0.1.0"
description = "Self-hosted OCR API for handwritten note images"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "pillow>=11,<12",
    "pillow-heif>=1.0,<2",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real PaddleOCR engine"]
