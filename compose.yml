services:
  my-ocr-app:
    image: my-ocr-app:latest
    container_name: my-ocr-app
    pull_policy: never
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    env_file:
      - .env
    volumes:
      - ocr-models:/models
    networks:
      - caddy
    mem_limit: 2300m
    memswap_limit: 2800m
    cpus: 3.0
    pids_limit: 256
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=16m,mode=755
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  caddy:
    external: true

volumes:
  ocr-models:
    name: ocr-models
